version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npx vite build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    appRoot: prototypes/yong
  - appRoot: yong2
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # Amplify Hosting compute (WEB_COMPUTE platform) supplies
            # node_modules at runtime — do NOT cp them into .next or the
            # artifact balloons past the 230MB upload cap (we hit 833MB).
            # Build also surprisingly survives the local-Windows
            # /_global-error prerender crash on Amplify's Linux runner —
            # no '|| true' needed.
            - npm run build
            - test -f .next/BUILD_ID || (echo "Next build did not emit BUILD_ID — compilation failed" && exit 1)
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
