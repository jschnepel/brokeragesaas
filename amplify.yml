version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npx vite build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    appRoot: prototypes/yong
  - appRoot: yong2
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # ── Step 1 — resolve Spark token (Amplify branch env wins,
            # else read from SM rlsir/armls/tokens). Write to /tmp so
            # subsequent commands can re-read it. Single source of
            # truth = Secrets Manager. ──────────────────────────────
            - |
              if [ -n "${SPARK_ACCESS_TOKEN:-}" ]; then
                echo "[spark-token] using branch env (${#SPARK_ACCESS_TOKEN} bytes)" >&2
                printf '%s' "$SPARK_ACCESS_TOKEN" > /tmp/spark_token
              else
                echo "[spark-token] reading from SM rlsir/armls/tokens..." >&2
                SM_JSON=$(aws secretsmanager get-secret-value \
                  --secret-id rlsir/armls/tokens \
                  --region us-east-1 \
                  --query SecretString --output text 2>&1)
                if [ $? -eq 0 ]; then
                  printf '%s' "$SM_JSON" | python3 -c "import sys, json; sys.stdout.write(json.load(sys.stdin).get('access_token', ''))" > /tmp/spark_token
                  echo "[spark-token] SM read OK ($(wc -c < /tmp/spark_token) bytes)" >&2
                else
                  echo "[spark-token] SM read FAILED: ${SM_JSON:0:200}" >&2
                  : > /tmp/spark_token
                fi
              fi
            # ── Step 2 — bake build-time env file (NEXT_PUBLIC_* +
            # build-time-only vars). Server runtime reads from Amplify
            # branch env, populated in step 3 below. ───────────────
            - |
              SPARK_ACCESS_TOKEN=$(cat /tmp/spark_token 2>/dev/null || echo "")
              {
                printf 'RDS_DATABASE_URL=%s\n' "${RDS_DATABASE_URL:-}"
                printf 'NEXT_PUBLIC_SITE_URL=%s\n' "${NEXT_PUBLIC_SITE_URL:-https://feature-yong2-amplify.d2tuygdje4mmy3.amplifyapp.com}"
                printf 'NEXT_PUBLIC_MAPTILER_KEY=%s\n' "${NEXT_PUBLIC_MAPTILER_KEY:-6DagWlYgkxoFxL5RaX6S}"
                printf 'NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=%s\n' "${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}"
                printf 'NEXT_PUBLIC_CLARITY_PROJECT_ID=%s\n' "${NEXT_PUBLIC_CLARITY_PROJECT_ID:-}"
                printf 'NEXT_PUBLIC_POSTHOG_KEY=%s\n' "${NEXT_PUBLIC_POSTHOG_KEY:-}"
                printf 'RESEND_API_KEY=%s\n' "${RESEND_API_KEY:-}"
                printf 'CONTACT_TO_EMAIL=%s\n' "${CONTACT_TO_EMAIL:-}"
                printf 'CONTACT_FROM_EMAIL=%s\n' "${CONTACT_FROM_EMAIL:-}"
                # Write unquoted — Next.js's @next/env dotenv parser
                # was silently dropping the line when wrapped in single
                # quotes (build #59 confirmed via /api/diag/env that RDS
                # was inlined but SPARK_ACCESS_TOKEN was not). Token is
                # opaque alphanumeric per byte inspection (no $ or #),
                # so unquoted is safe.
                printf 'SPARK_ACCESS_TOKEN=%s\n' "${SPARK_ACCESS_TOKEN:-}"
              } > .env.production.local
            # ── Step 3 — sync the resolved token into Amplify branch
            # env so the SSR runtime can read it. (Runtime can't read
            # .env.production.local server vars on Amplify Compute, and
            # can't call SM at request time because the runtime has no
            # AWS SDK credentials.) Merges with existing branch env to
            # avoid wiping anything else. ──────────────────────────
            - |
              SPARK_ACCESS_TOKEN=$(cat /tmp/spark_token 2>/dev/null || echo "")
              export SPARK_ACCESS_TOKEN
              if [ -n "$SPARK_ACCESS_TOKEN" ]; then
                python3 - "$AWS_APP_ID" "$AWS_BRANCH" <<'PY' > /tmp/branch_env.json
              import sys, os, json, subprocess
              app_id, branch = sys.argv[1], sys.argv[2]
              token = os.environ.get('SPARK_ACCESS_TOKEN', '')
              res = subprocess.run(
                  ['aws', 'amplify', 'get-branch',
                   '--app-id', app_id, '--branch-name', branch,
                   '--region', 'us-east-1',
                   '--query', 'branch.environmentVariables',
                   '--output', 'json'],
                  capture_output=True, text=True, check=True)
              env = json.loads(res.stdout) or {}
              env['SPARK_ACCESS_TOKEN'] = token
              print(json.dumps(env))
              PY
                if aws amplify update-branch \
                  --app-id "$AWS_APP_ID" --branch-name "$AWS_BRANCH" \
                  --region us-east-1 \
                  --environment-variables "file:///tmp/branch_env.json" >/tmp/ub.out 2>&1; then
                  echo "[spark-token] branch env synced" >&2
                else
                  echo "[spark-token] update-branch FAILED:" >&2
                  cat /tmp/ub.out >&2
                fi
              else
                echo "[spark-token] empty token, skipping branch env sync" >&2
              fi
            # ── Sanity diagnostics ────────────────────────────────
            - 'echo "DSN bytes baked: $(grep ^RDS_DATABASE_URL= .env.production.local | wc -c)"'
            - 'echo "Spark token line bytes: $(grep ^SPARK_ACCESS_TOKEN= .env.production.local | wc -c)"'
            - 'echo "Total .env lines: $(wc -l < .env.production.local)"'
            - 'echo "Env var keys: $(grep -oE "^[A-Z_]+=" .env.production.local | tr "\n" " ")"'
            - npm run build
            - test -f .next/BUILD_ID || (echo "Next build did not emit BUILD_ID — compilation failed" && exit 1)
            # ── Pre-warm CloudFront for the chart-feeding marts so the
            # first real user pays edge-cache latency, not S3 latency.
            # Non-fatal — runtime still works if any of these miss. ───
            - |
              # Prewarm small/medium files first (fast); then community
              # (~85MB) + subdivision (~121MB) so CloudFront caches them
              # and SSR Lambda gets edge-fetched bytes instead of S3-cold.
              for f in fct_market_pulse_metro fct_market_pulse_region fct_market_pulse_zipcode \
                       fct_market_pulse_community fct_market_pulse_subdivision \
                       fct_negotiation_metro fct_negotiation_region fct_negotiation_zipcode \
                       fct_negotiation_community fct_negotiation_subdivision \
                       fct_pricereduction_metro fct_pricereduction_region fct_pricereduction_zipcode \
                       fct_pricereduction_community fct_pricereduction_subdivision \
                       fct_active_inventory fct_active_dom_distribution fct_active_by_pricetier \
                       fct_listing_pace fct_status_velocity fct_months_of_supply; do
                start=$(date +%s)
                code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "https://d12v6de1xwcjhk.cloudfront.net/${f}.parquet" || echo "ERR")
                echo "[prewarm] ${f}: ${code} ($(( $(date +%s) - start ))s)" >&2
              done
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
