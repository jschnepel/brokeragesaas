version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npx vite build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    appRoot: prototypes/yong
  - appRoot: yong2
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # Amplify Hosting Next.js Compute does NOT pass app/branch
            # env vars to the SSR runtime — they're build-time only
            # (verified via /api/diag/env: 0 of our custom vars visible).
            # Workaround: bake them into .env.production.local before
            # `next build`. Next.js inlines server-side env vars into
            # the server bundle (NEXT_PUBLIC_ ones go to the client
            # bundle). Vars without NEXT_PUBLIC_ stay server-only.
            - |
              {
                printf 'RDS_DATABASE_URL=%s\n' "${RDS_DATABASE_URL:-}"
                printf 'NEXT_PUBLIC_SITE_URL=%s\n' "${NEXT_PUBLIC_SITE_URL:-https://feature-yong2-amplify.d2tuygdje4mmy3.amplifyapp.com}"
                printf 'NEXT_PUBLIC_MAPTILER_KEY=%s\n' "${NEXT_PUBLIC_MAPTILER_KEY:-6DagWlYgkxoFxL5RaX6S}"
                printf 'NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=%s\n' "${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}"
                printf 'NEXT_PUBLIC_CLARITY_PROJECT_ID=%s\n' "${NEXT_PUBLIC_CLARITY_PROJECT_ID:-}"
                printf 'NEXT_PUBLIC_POSTHOG_KEY=%s\n' "${NEXT_PUBLIC_POSTHOG_KEY:-}"
                printf 'RESEND_API_KEY=%s\n' "${RESEND_API_KEY:-}"
                printf 'CONTACT_TO_EMAIL=%s\n' "${CONTACT_TO_EMAIL:-}"
                printf 'CONTACT_FROM_EMAIL=%s\n' "${CONTACT_FROM_EMAIL:-}"
                # Spark API — listings come live from Spark per-request.
                # Token comes from AWS Secrets Manager (`rlsir/armls/tokens`)
                # via the Amplify build runner's IAM role — same source
                # the rlsir-armls-sync + rlsir-active-snapshot Lambdas use.
                # Branch-level SPARK_ACCESS_TOKEN env wins if set (escape
                # hatch); otherwise we resolve from SM at build time.
                # SPARK_LIST_AGENT_KEY = Yong's ARMLS member ID (preferred
                # exact-match filter); SPARK_LIST_AGENT_NAME = name
                # substring fallback (default 'Yong Choi').
                if [ -z "${SPARK_ACCESS_TOKEN:-}" ]; then
                  SPARK_ACCESS_TOKEN=$(aws secretsmanager get-secret-value \
                    --secret-id rlsir/armls/tokens \
                    --region us-east-1 \
                    --query SecretString --output text 2>/dev/null \
                    | python3 -c "import sys, json; print(json.load(sys.stdin).get('access_token', ''))" 2>/dev/null) || SPARK_ACCESS_TOKEN=""
                fi
                printf 'SPARK_ACCESS_TOKEN=%s\n' "${SPARK_ACCESS_TOKEN:-}"
                printf 'SPARK_LIST_AGENT_KEY=%s\n' "${SPARK_LIST_AGENT_KEY:-}"
                printf 'SPARK_LIST_AGENT_NAME=%s\n' "${SPARK_LIST_AGENT_NAME:-Yong Choi}"
              } > .env.production.local
            # Sanity check: confirm the DSN made it into the file (no
            # value leak — just checks length).
            - 'echo "DSN bytes baked: $(grep ^RDS_DATABASE_URL= .env.production.local | wc -c)"'
            - npm run build
            - test -f .next/BUILD_ID || (echo "Next build did not emit BUILD_ID — compilation failed" && exit 1)
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
