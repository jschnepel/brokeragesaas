# yong2 reserved Docker port: 3200 (host) → 3000 (container)
# Do not change without updating yong2/README.md port registry.
services:
  yong2:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: yong2-dev
    ports:
      - "3200:3000"
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
      # Read-only host AWS credentials so the SDK auto-discovers them in
      # dev (mart S3 reads). Production runs on Amplify SSR with an IAM
      # role — no creds file needed there.
      - ${USERPROFILE:-${HOME}}/.aws:/root/.aws:ro
    env_file:
      - path: .env.local
        required: false
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - AWS_REGION=us-east-1
      - AWS_SDK_LOAD_CONFIG=1
    restart: unless-stopped
