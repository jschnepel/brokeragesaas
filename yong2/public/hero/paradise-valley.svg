<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Paradise Valley">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2C38"/>
      <stop offset="100%" stop-color="#0B1620"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4B88A" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#D4B88A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#accent)"/>
  <!-- Camelback silhouette (camel-shape ridge) -->
  <path d="M0,880 L200,820 L380,740 L520,680 L640,620 L760,650 L880,720 L1020,740 L1200,780 L1200,1200 L0,1200 Z" fill="#0B1620" opacity="0.6"/>
  <g font-family="Georgia, 'Playfair Display', serif" fill="#D4B88A" text-anchor="middle">
    <text x="600" y="500" font-size="32" letter-spacing="8">PARADISE VALLEY</text>
    <text x="600" y="600" font-size="84" font-style="italic" font-weight="300" fill="#EFE9DF">Paradise Valley</text>
    <line x1="520" y1="640" x2="680" y2="640" stroke="#D4B88A" stroke-width="1"/>
  </g>
</svg>
