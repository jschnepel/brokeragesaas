<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sonoran desert horizon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1620"/>
      <stop offset="55%" stop-color="#1E2C38"/>
      <stop offset="100%" stop-color="#2a3645"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.42" r="0.18">
      <stop offset="0%" stop-color="#D4B88A" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#D4B88A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D4B88A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1620" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0B1620"/>
    </linearGradient>
    <linearGradient id="ridge2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2C38" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1E2C38"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#sun)"/>
  <!-- Distant ridge -->
  <path d="M0,720 L180,640 L360,690 L540,610 L720,665 L900,580 L1080,650 L1260,595 L1440,640 L1620,560 L1800,620 L1920,590 L1920,1080 L0,1080 Z" fill="url(#ridge2)" opacity="0.55"/>
  <!-- Mid mesa -->
