    <path d="M260,910 q-8,-90 0,-130 q4,-22 18,-22 q14,0 18,22 q8,40 0,130 Z M252,830 q-26,-4 -36,-30 q-4,-12 4,-22 q10,-8 22,-2 q12,8 16,30 Z M286,850 q26,-4 36,-30 q4,-12 -4,-22 q-10,-8 -22,-2 q-12,8 -16,30 Z"/>
    <path d="M1500,940 q-6,-70 0,-100 q3,-16 14,-16 q11,0 14,16 q6,30 0,100 Z M1495,890 q-18,-2 -26,-22 q-2,-8 4,-14 q8,-6 16,-2 q8,4 12,20 Z"/>
