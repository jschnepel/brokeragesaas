<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RLSIR Community Boundary Editor</title>
  <!-- draw control: @geoman-io/maplibre-geoman-free@0.2.10 (last release supporting maplibre-gl@4.x) -->
  <!-- maplibre-gl and mapbox-gl loaded as UMD globals so geoman UMD can consume them directly. -->
  <!-- geoman's ES bundle does named imports from mapbox-gl (CJS interop) that break in raw ESM;
       the UMD build uses globals and avoids that constraint entirely. -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@geoman-io/maplibre-geoman-free@0.2.10/dist/maplibre-geoman.css" rel="stylesheet" />
  <!-- 1. maplibre-gl global (sets window.maplibregl) -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <!-- 2. mapbox-gl global required by geoman dual-adapter (sets window.mapboxgl) -->
  <script src="https://unpkg.com/mapbox-gl@2.15.0/dist/mapbox-gl.js"></script>
  <!-- 3. geoman UMD — reads window.maplibregl + window.mapboxgl, sets window.Geoman -->
  <script src="https://cdn.jsdelivr.net/npm/@geoman-io/maplibre-geoman-free@0.2.10/dist/maplibre-geoman.umd.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0 320px 0 0; }
    #panel { position: absolute; top: 0; right: 0; bottom: 0; width: 320px; padding: 16px; box-sizing: border-box; background: #0c1c2e; color: #f9f8f6; overflow: auto; }
    label { display: block; margin: 8px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #bfa67a; }
    input, button { width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 8px; }
    button { background: #bfa67a; border: 0; color: #0c1c2e; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .count { font-size: 28px; font-weight: 700; }
    .muted { color: #9fb0c0; font-size: 12px; }
    /* Side-panel community list rows */
    .shape-row { display: block; width: 100%; text-align: left; padding: 6px 4px; background: transparent; color: #f9f8f6; border: 0; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; font: inherit; }
    .shape-row:hover { background: rgba(191,166,122,0.12); }
    .shape-row.selected { background: rgba(191,166,122,0.25); }
    .shape-row .name { display: block; font-weight: 600; }
    .shape-row .meta { display: block; font-size: 11px; color: #9fb0c0; }
    /* Snap indicator: thin gold ring around candidate listing dot */
    /* Rendered via the snap-candidate geojson layer — no extra CSS needed. */
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <!-- ── Communities list (top of panel) ── -->
    <div id="shape-list-header" class="muted" style="margin-bottom: 4px;">Communities</div>
    <div id="shape-list" style="max-height: 35vh; overflow-y: auto; margin-bottom: 16px; border-top: 1px solid rgba(255,255,255,0.08); border-bottom: 1px solid rgba(255,255,255,0.08);"></div>

    <!-- ── Boolean Ops panel ── -->
    <div id="boolops-panel" style="margin-bottom: 16px;">
      <label>Boolean Ops <span class="muted" style="text-transform: none; letter-spacing: 0; font-size: 11px;">(Shift+click 2 shapes)</span></label>
      <div id="boolops-status" class="muted" style="margin-bottom: 6px;">0 selected</div>
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px;">
        <button id="op-union" disabled>Union</button>
        <button id="op-subtract" disabled>Subtract</button>
        <button id="op-intersect" disabled>Intersect</button>
      </div>
    </div>

    <!-- ── Weld Nearby Vertices panel ── -->
    <div id="weld-panel" style="margin-bottom: 16px;">
      <label>Weld nearby vertices <span class="muted" style="text-transform: none; letter-spacing: 0; font-size: 11px;">(select 1 shape)</span></label>
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
        <input id="weld-threshold" type="range" min="1" max="50" step="1" value="10" style="flex: 1;" />
        <span id="weld-threshold-label" class="muted" style="font-variant-numeric: tabular-nums; width: 40px; text-align: right;">10 m</span>
      </div>
      <button id="op-weld" disabled>Weld vertices</button>
    </div>

    <!-- ── Save form (unchanged from v1) ── -->
    <label>Community slug</label>
    <input id="slug" placeholder="troon-north" />
    <label>Display name</label>
    <input id="name" placeholder="Troon North" />
    <label>Region slug</label>
    <input id="region" placeholder="north-scottsdale" />
    <label>Listings inside polygon</label>
    <div class="count" id="count">—</div>
    <div class="muted" id="meta"></div>
    <button id="save">Save community</button>
    <div class="muted" id="status"></div>
  </div>

  <script type="module">
    import booleanPointInPolygon from 'https://esm.sh/@turf/boolean-point-in-polygon@7';
    import { point, featureCollection } from 'https://esm.sh/@turf/helpers@7';
    import centroid              from 'https://esm.sh/@turf/centroid@7';
    import bbox                  from 'https://esm.sh/@turf/bbox@7';
    // Boolean-op helpers — inlined here because geo-compute.ts is Node/Vitest only
    // and cannot be imported directly in the browser's ESM context.
    // Implementations mirror geo-compute.ts exactly; esm.sh serves turf v7 ESM bundles.
    import turfUnion       from 'https://esm.sh/@turf/union@7';
    import turfDifference  from 'https://esm.sh/@turf/difference@7';
    import turfIntersect   from 'https://esm.sh/@turf/intersect@7';
    import turfDistance    from 'https://esm.sh/@turf/distance@7';

    function _asFeature(geom) {
      return { type: 'Feature', properties: {}, geometry: geom };
    }
    // unionPolygons — mirrors geo-compute.ts unionPolygons
    function unionPolygons(a, b) {
      var result = turfUnion(featureCollection([_asFeature(a), _asFeature(b)]));
      return result ? result.geometry : null;
    }
    // differencePolygons — mirrors geo-compute.ts differencePolygons (A minus B)
    function differencePolygons(a, b) {
      var result = turfDifference(featureCollection([_asFeature(a), _asFeature(b)]));
      return result ? result.geometry : null;
    }
    // intersectPolygons — mirrors geo-compute.ts intersectPolygons
    function intersectPolygons(a, b) {
      var result = turfIntersect(featureCollection([_asFeature(a), _asFeature(b)]));
      return result ? result.geometry : null;
    }

    // weldNearbyVertices — mirrors geo-compute.ts weldNearbyVertices
    // Walks each ring, drops vertices within thresholdMeters of the previous kept
    // vertex (using turf distance in km), preserves ring closure, never degenerates
    // below 4 points (3 unique + closing repeat).
    function weldNearbyVertices(geom, thresholdMeters) {
      var km = thresholdMeters / 1000;
      var MIN_RING_LEN = 4;
      var weldRing = function(ring) {
        if (ring.length < MIN_RING_LEN) return ring;
        var keep = [ring[0]];
        for (var i = 1; i < ring.length - 1; i++) {
          var prev = keep[keep.length - 1];
          var d = turfDistance(prev, ring[i], { units: 'kilometers' });
          if (d > km) keep.push(ring[i]);
        }
        keep.push(keep[0]);
        return keep.length >= MIN_RING_LEN ? keep : ring;
      };
      return { type: 'Polygon', coordinates: geom.coordinates.map(weldRing) };
    }
    // weldGeometry — dispatches to weldNearbyVertices for Polygon or MultiPolygon
    function weldGeometry(geom, thresholdMeters) {
      if (geom.type === 'Polygon') return weldNearbyVertices(geom, thresholdMeters);
      if (geom.type === 'MultiPolygon') {
        return {
          type: 'MultiPolygon',
          coordinates: geom.coordinates.map(function(poly) {
            return weldNearbyVertices({ type: 'Polygon', coordinates: poly }, thresholdMeters).coordinates;
          }),
        };
      }
      return geom;
    }
    // countVertices — counts all coordinate positions across all rings
    function countVertices(geom) {
      if (geom.type === 'Polygon') return geom.coordinates.reduce(function(s, r) { return s + r.length; }, 0);
      if (geom.type === 'MultiPolygon') return geom.coordinates.reduce(function(s, p) { return s + p.reduce(function(ss, r) { return ss + r.length; }, 0); }, 0);
      return 0;
    }

    // UMD globals set by the <script> tags in <head>.
    // geoman UMD assigns its namespace to window.Geoman; the constructor is at .Geoman.
    const maplibregl = window.maplibregl;
    const Geoman     = window.Geoman.Geoman;

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://api.maptiler.com/maps/streets/style.json?key=6DagWlYgkxoFxL5RaX6S',
      center: [-111.9, 33.7],
      zoom: 10,
    });

    const gm = new Geoman(map, {});

    // ── Snap configuration ──────────────────────────────────────────────────────
    //
    // Snap API verified from @geoman-io/maplibre-geoman-free@0.2.10 type defs:
    //   - enableMode('helper', 'snapping') activates the SnappingHelper
    //   - SnappingHelper is instantiated and stored at gm.actionInstances['helper__snapping']
    //   - SnappingHelper.tolerance: number — the snap radius in pixels
    //   - SnappingHelper.setCustomSnappingCoordinates(sectionKey, lngLats) — registers
    //     external [lng, lat][] arrays as snap targets (used for listing dots)
    //
    // Default tolerance: 12 px.  Space-bar boost: 24 px.
    // Geoman natively snaps to vertex + edge + midpoint for drawn features.
    // Listing dots snap via setCustomSnappingCoordinates('listings', [...]).
    //
    // Note: snap is enabled here at construction time so the helper instance is
    // created before the first draw mode starts.  The helper persists while it is
    // active; listing coordinates are pushed in whenever listings load/refresh.

    const SNAP_RADIUS_DEFAULT = 12; // pixels
    const SNAP_RADIUS_BOOSTED = 24; // pixels while Space is held

    // snapStrongMode is toggled by Space key — exposed on window for Puppeteer tests.
    let snapStrongMode = false;
    window.__snapStrongMode = false;

    // Helper accessor — populated after enableMode so the instance exists.
    function getSnappingHelper() {
      return gm.actionInstances['helper__snapping'] || null;
    }

    // Push listing coordinates into geoman's native snap engine.
    // Called whenever the listings array is refreshed.
    function syncListingsSnapCoords() {
      const helper = getSnappingHelper();
      if (!helper || typeof helper.setCustomSnappingCoordinates !== 'function') return;
      // LngLat format in geoman type defs: [number, number] = [lng, lat]
      const coords = listings.map(function(l) { return [l.lng, l.lat]; });
      helper.setCustomSnappingCoordinates('listings', coords);
    }

    // Expose for headless verification and testing.
    window.__map = map;
    window.__gm  = gm;

    // ── Undo / Redo stack ───────────────────────────────────────────────────────
    //
    // Snapshots the geoman FeatureCollection on every committed change.
    // Cap: 50 entries.  Cmd+Z (or Ctrl+Z) undoes; Cmd+Shift+Z (or Ctrl+Shift+Z) redoes.
    //
    // isRestoring guards against re-entrant snapshots: while restore() is clearing
    // and re-adding features it temporarily fires gm:create / gm:remove events —
    // those are suppressed so the stack does not corrupt.

    const undoStack = [];
    const redoStack = [];
    const UNDO_CAP  = 50;
    let isRestoring = false;

    function deepCloneFC(fc) {
      return structuredClone(fc);
    }

    function snapshot() {
      if (isRestoring) return;
      const fc = window.__gm.features.getAll();
      undoStack.push(deepCloneFC(fc));
      if (undoStack.length > UNDO_CAP) undoStack.shift();
      redoStack.length = 0;
    }

    async function restore(fc) {
      isRestoring = true;
      try {
        const current = window.__gm.features.getAll();
        for (const f of current.features) {
          const fd = window.__gm.features.get('gm_main', f.id);
          if (fd) window.__gm.features.delete(fd);
        }
        if (typeof window.__gm.features.importGeoJson === 'function') {
          window.__gm.features.importGeoJson(fc);
        } else {
          for (const f of fc.features) window.__gm.features.addGeoJsonFeature(f);
        }
      } finally {
        isRestoring = false;
      }
      // Clear boolops selection — restored IDs may no longer match.
      if (typeof selected !== 'undefined') { selected = []; }
      if (typeof updateBoolopsUI === 'function') updateBoolopsUI();
      if (typeof renderShapeList === 'function') {
        const all = window.__gm.features.getAll().features
          .filter(function(f) { return f.properties && f.properties.communitySlug; })
          .map(function(f) { return {
            slug:       f.properties.communitySlug,
            name:       f.properties.communityName || f.properties.communitySlug,
            regionSlug: f.properties.regionSlug,
            areaSqMi:   f.properties.areaSqMi,
            geometry:   f.geometry,
          }; });
        renderShapeList(all);
      }
    }

    // Expose stacks for Puppeteer test harness.
    window.__snapshot   = snapshot;
    window.__undoStack  = undoStack;
    window.__redoStack  = redoStack;
    window.__syncListingsSnapCoords = syncListingsSnapCoords;
    window.__getSnappingHelper = getSnappingHelper;

    let listings = []; // [{lng, lat, ...}]

    // ── Listings layer ──────────────────────────────────────────────────────────

    async function loadListings() {
      const b = map.getBounds();
      const bboxStr = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].join(',');
      try {
        const res = await fetch('/api/listings?bbox=' + bboxStr);
        const data = await res.json();
        // Guard: server returns {error:...} on DB failure — treat as empty list
        listings = Array.isArray(data) ? data : [];
      } catch (_err) {
        // RDS_DATABASE_URL missing or unreachable — listings stays empty, editor
        // still loads and the polygon tools function normally.
        listings = [];
      }
      const fc = { type: 'FeatureCollection', features: listings.map(function(l) {
        return { type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: [l.lng, l.lat] } };
      }) };
      const src = map.getSource('listings');
      if (src) {
        src.setData(fc);
      } else {
        map.addSource('listings', { type: 'geojson', data: fc });
        map.addLayer({ id: 'listings', type: 'circle', source: 'listings',
          paint: { 'circle-radius': 3, 'circle-color': '#d4654b', 'circle-opacity': 0.7 } });
      }
      // Push new listing coordinates into geoman's native snap engine so the
      // snapping helper targets the current viewport's listing dots.
      syncListingsSnapCoords();
      // Refresh inside-counts in the list whenever the viewport's listings update.
      renderShapeList(_loadedCommunities);
    }

    // ── Hover-highlight source + layer ──────────────────────────────────────────

    function initHoverLayer() {
      if (!map.getSource('community-hover')) {
        map.addSource('community-hover', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] },
        });
        map.addLayer({
          id: 'community-hover',
          type: 'line',
          source: 'community-hover',
          paint: { 'line-color': '#bfa67a', 'line-width': 4, 'line-opacity': 0.9 },
        });
      }
    }

    // ── Snap-candidate ring source + layer ──────────────────────────────────────
    //
    // A thin gold ring drawn around the nearest listing dot when it is within
    // snap range.  Empty FeatureCollection by default; set to a 1-feature FC
    // during mousemove when a snap candidate exists.
    //
    // Layer sits above 'listings' so the ring is always visible.

    const SNAP_CANDIDATE_EMPTY = { type: 'FeatureCollection', features: [] };

    function initSnapCandidateLayer() {
      if (!map.getSource('snap-candidate')) {
        map.addSource('snap-candidate', {
          type: 'geojson',
          data: SNAP_CANDIDATE_EMPTY,
        });
        // Outer ring: gold stroke
        map.addLayer({
          id: 'snap-candidate',
          type: 'circle',
          source: 'snap-candidate',
          paint: {
            'circle-radius': 9,
            'circle-color': 'transparent',
            'circle-stroke-width': 2,
            'circle-stroke-color': '#bfa67a',
            'circle-opacity': 1,
          },
        });
      }
    }

    // Active snap candidate: {lng, lat} or null.
    // Exposed on window for Puppeteer testing.
    let _snapCandidate = null;
    window.__snapCandidate = null;

    function setSnapCandidate(lngLat) {
      _snapCandidate = lngLat;
      window.__snapCandidate = lngLat;
      const src = map.getSource('snap-candidate');
      if (!src) return;
      if (!lngLat) {
        src.setData(SNAP_CANDIDATE_EMPTY);
        return;
      }
      src.setData({
        type: 'FeatureCollection',
        features: [{
          type: 'Feature',
          properties: {},
          geometry: { type: 'Point', coordinates: [lngLat.lng, lngLat.lat] },
        }],
      });
    }

    // ── Mousemove snap-candidate detection ─────────────────────────────────────
    //
    // On each mousemove, find the listing dot nearest to the cursor (in pixels).
    // If it falls within the active snap radius, show the gold ring overlay.
    // This is a pure visual aid — geoman's snap engine handles the actual vertex
    // correction via setCustomSnappingCoordinates.

    function onMapMouseMove(e) {
      if (!listings.length) return;

      const helper = getSnappingHelper();
      const radius = (helper && helper.tolerance) ? helper.tolerance : SNAP_RADIUS_DEFAULT;

      const cursorPx = e.point; // {x, y} in screen pixels
      let bestDist = Infinity;
      let bestListing = null;

      for (let i = 0; i < listings.length; i++) {
        const l = listings[i];
        const dotPx = map.project([l.lng, l.lat]);
        const dx = dotPx.x - cursorPx.x;
        const dy = dotPx.y - cursorPx.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < bestDist) {
          bestDist = dist;
          bestListing = l;
        }
      }

      if (bestListing && bestDist <= radius) {
        setSnapCandidate({ lng: bestListing.lng, lat: bestListing.lat });
      } else {
        setSnapCandidate(null);
      }
    }

    // ── Polygon helpers ─────────────────────────────────────────────────────────

    function currentPolygon() {
      // gm.features.getAll() returns a GeoJSON FeatureCollection of all drawn features.
      // Filter to Polygons; last one wins (consistent with v1 behaviour).
      const fc = gm.features.getAll();
      if (!fc) return null;
      const polys = fc.features.filter(function(f) {
        return f.geometry && (f.geometry.type === 'Polygon' || f.geometry.type === 'MultiPolygon');
      });
      return polys.length ? polys[polys.length - 1] : null;
    }

    function updateCount() {
      const poly = currentPolygon();
      if (!poly) { document.getElementById('count').textContent = '—'; return; }
      let n = 0;
      for (const l of listings) {
        if (booleanPointInPolygon(point([l.lng, l.lat]), poly)) n += 1;
      }
      document.getElementById('count').textContent = String(n);
      document.getElementById('meta').textContent = poly.geometry.coordinates[0].length + ' vertices';
      // Also re-render list so the unsaved row gets updated
      renderShapeList(_loadedCommunities);
    }

    // ── Communities — load into geoman ──────────────────────────────────────────

    // Holds the last-fetched communities array so list rerenders can reuse it.
    let _loadedCommunities = [];

    async function loadCommunities() {
      let all = [];
      try {
        const res = await fetch('/api/boundaries');
        const data = await res.json();
        // Guard: server returns {error:...} on DB failure — treat as empty list
        all = Array.isArray(data) ? data : [];
      } catch (_err) {
        // DB unavailable — empty list, no error shown
      }
      _loadedCommunities = all.filter(function(b) { return b.type === 'community'; });

      for (const c of _loadedCommunities) {
        if (!c.geometry) continue;
        const feature = {
          type: 'Feature',
          // gm.features.addGeoJsonFeature accepts ImportGeoJsonProperties which
          // allows arbitrary [key: string]: unknown extra properties — we stamp
          // communitySlug so we can look the feature up later via getAll().
          properties: {
            communitySlug: c.slug,
            communityName: c.name,
            regionSlug:    c.regionSlug,
            areaSqMi:      c.areaSqMi,
          },
          geometry: c.geometry,
        };
        // Verified API (maplibre-geoman 0.2.10 type defs):
        //   gm.features.addGeoJsonFeature(GeoJsonImportFeature) → FeatureData | null
        // Fallback: gm.features.importGeoJson(FeatureCollection)
        try {
          gm.features.addGeoJsonFeature(feature);
        } catch (_e1) {
          try {
            gm.features.importGeoJson({ type: 'FeatureCollection', features: [feature] });
          } catch (_e2) {
            // Could not add to geoman — skip, operator can redraw
          }
        }
      }

      renderShapeList(_loadedCommunities);
    }

    // ── Side-panel list ─────────────────────────────────────────────────────────

    function computeInsideCount(geometry) {
      let n = 0;
      for (const l of listings) {
        try {
          if (booleanPointInPolygon(point([l.lng, l.lat]), { type: 'Feature', properties: {}, geometry: geometry })) n += 1;
        } catch (_err) { /* non-polygon geometry — skip */ }
      }
      return n;
    }

    function makeShapeRow(c) {
      const inside = c.geometry ? computeInsideCount(c.geometry) : 0;
      const area   = c.areaSqMi != null ? Number(c.areaSqMi).toFixed(2) : '—';

      const row  = document.createElement('button');
      row.className = 'shape-row';
      if (c.slug) row.dataset.slug = c.slug;

      const nameSpan = document.createElement('span');
      nameSpan.className = 'name';
      nameSpan.textContent = c.name;

      const metaSpan = document.createElement('span');
      metaSpan.className = 'meta';
      metaSpan.textContent = area + ' sq mi · ' + inside + ' listings inside';

      row.appendChild(nameSpan);
      row.appendChild(metaSpan);

      row.addEventListener('mouseenter', function() {
        if (c.geometry) {
          map.getSource('community-hover').setData({
            type: 'FeatureCollection',
            features: [{ type: 'Feature', properties: {}, geometry: c.geometry }],
          });
        }
      });
      row.addEventListener('mouseleave', function() {
        map.getSource('community-hover').setData({ type: 'FeatureCollection', features: [] });
      });
      row.addEventListener('click', function() {
        if (!c.geometry) return;
        const b = bbox({ type: 'Feature', properties: {}, geometry: c.geometry });
        map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: 60, duration: 600 });
        if (c.slug) selectCommunityInGeoman(c.slug);
      });

      return row;
    }

    function renderShapeList(communities) {
      const list = document.getElementById('shape-list');
      // Remove all existing children without innerHTML
      while (list.firstChild) list.removeChild(list.firstChild);

      // Also collect any in-geoman shapes that have no communitySlug (freshly
      // drawn, not yet saved) and append them as "(unsaved)" rows.
      const allRows = communities.slice();
      const gmFc = gm.features.getAll();
      if (gmFc && gmFc.features) {
        for (const f of gmFc.features) {
          const slug = f.properties && f.properties.communitySlug;
          if (slug) continue; // already in communities list
          if (!f.geometry || (f.geometry.type !== 'Polygon' && f.geometry.type !== 'MultiPolygon')) continue;
          allRows.push({ slug: null, name: '(unsaved)', areaSqMi: null, geometry: f.geometry });
        }
      }

      if (!allRows.length) {
        const hint = document.createElement('div');
        hint.className = 'muted';
        hint.style.padding = '8px 4px';
        hint.textContent = 'No communities yet — draw one.';
        list.appendChild(hint);
        return;
      }

      for (const c of allRows) {
        list.appendChild(makeShapeRow(c));
      }
    }

    // Expose for Puppeteer testing so the harness can inject and verify the list.
    window.__renderShapeList = renderShapeList;

    // ── Programmatic selection ──────────────────────────────────────────────────
    //
    // geoman 0.2.10 type defs confirm there is NO public gm.features.select(id)
    // method.  Fallback path used:
    //   1. Enable the vertex-edit mode ('edit', 'change') so the operator can
    //      immediately start editing the clicked shape.
    //   2. Walk gm.features.getAll() to find the matching feature.
    //   3. Compute its centroid and fire a synthetic map 'click' at that screen
    //      point so geoman's internal hit-test can select the right feature.
    //
    // FALLBACK — if a future geoman version exposes a direct select API,
    // swap it in here.
    function selectCommunityInGeoman(slug) {
      // Enable change/vertex-edit mode so clicks activate vertex handles.
      try {
        gm.enableMode('edit', 'change');
      } catch (_err) { /* mode may already be active */ }

      const fc = gm.features.getAll();
      if (!fc || !fc.features) return;

      const match = fc.features.find(function(f) {
        return f.properties && f.properties.communitySlug === slug;
      });
      if (!match || !match.geometry) return;

      // Compute centroid and fire a synthetic click so geoman's pointer
      // handler selects the shape.
      try {
        const ctr = centroid({ type: 'Feature', properties: {}, geometry: match.geometry });
        const coords = ctr.geometry.coordinates;
        const lng = coords[0];
        const lat = coords[1];
        const screenPt = map.project([lng, lat]);
        // map.fire routes through maplibre's event system — geoman listens here.
        map.fire('click', { lngLat: { lng: lng, lat: lat }, point: screenPt, originalEvent: {} });
      } catch (_err) {
        // Projection error — skip; shape is already visible from fitBounds.
      }
    }

    // ── Boolean Ops — selection state ──────────────────────────────────────────
    //
    // `selected` holds up to two geoman feature IDs in tap/click order.
    // Order matters: Subtract = selected[0] minus selected[1].
    //
    // Delete API (verified from @geoman-io/maplibre-geoman-free@0.2.10 type defs):
    //   gm.features.get('gm_main', featureId) → FeatureData | null
    //   gm.features.delete(featureData, keepMarkers?)
    // 'gm_main' is the primary drawn-feature source (featureSourceNames = ['main',
    // 'temporary', 'standby']; the library prepends the 'gm' prefix automatically
    // so the key is 'gm_main').

    var selected = []; // string[], geoman feature IDs in selection order

    function updateBoolopsUI() {
      var statusEl = document.getElementById('boolops-status');
      var btnUnion      = document.getElementById('op-union');
      var btnSubtract   = document.getElementById('op-subtract');
      var btnIntersect  = document.getElementById('op-intersect');

      // Build display names from selected feature slugs/names
      var displayNames = selected.map(function(id) {
        var fc = window.__gm.features.getAll();
        var f = fc && fc.features && fc.features.find(function(feat) {
          return String(feat.id) === String(id);
        });
        if (!f) return id;
        var p = f.properties;
        return (p && (p.communityName || p.communitySlug)) || '(unsaved)';
      });

      if (selected.length === 0) {
        statusEl.textContent = '0 selected';
      } else if (selected.length === 1) {
        statusEl.textContent = '1 selected — ' + displayNames[0];
      } else {
        statusEl.textContent = '2 selected — ' + displayNames[0] + ' + ' + displayNames[1];
      }

      // Union and Intersect require ≥2 selected; Subtract requires exactly 2.
      var canOp = selected.length >= 2;
      btnUnion.disabled     = !canOp;
      btnSubtract.disabled  = selected.length !== 2;
      btnIntersect.disabled = !canOp;

      // Weld requires exactly 1 selected feature.
      document.getElementById('op-weld').disabled = !(selected.length === 1);

      // Highlight matching side-panel rows
      var list = document.getElementById('shape-list');
      var rows = list ? list.querySelectorAll('.shape-row') : [];
      rows.forEach(function(row) {
        row.classList.remove('selected');
      });

      // For each selected ID, find the slug on that feature, then highlight the row
      var fc2 = window.__gm.features.getAll();
      selected.forEach(function(id) {
        var f = fc2 && fc2.features && fc2.features.find(function(feat) {
          return String(feat.id) === String(id);
        });
        if (!f) return;
        var slug = f.properties && f.properties.communitySlug;
        if (slug) {
          rows.forEach(function(row) {
            if (row.dataset.slug === slug) row.classList.add('selected');
          });
        }
      });
    }

    // Expose for Puppeteer test harness
    window.__updateBoolopsUI = updateBoolopsUI;
    Object.defineProperty(window, '__selected', {
      get: function() { return selected; },
      set: function(v) { selected = v; },
    });

    // Toggle a feature ID in the selection array (shift+click behaviour)
    function toggleSelected(id) {
      var strId = String(id);
      var idx = selected.indexOf(strId);
      if (idx !== -1) {
        // Already selected — deselect
        selected = selected.filter(function(s) { return s !== strId; });
      } else {
        // Add (cap at 2 — drop oldest if already at 2)
        if (selected.length >= 2) {
          selected = [selected[1], strId];
        } else {
          selected = selected.concat([strId]);
        }
      }
    }

    // ── Map click — polygon hit-test for boolops selection ─────────────────────
    //
    // On shift+click: toggle the hit feature in `selected`.
    // On plain click (no shift): clear selection (single-select is outside boolops
    // scope; non-shift clicks are forwarded to geoman's own edit/select logic).
    // Hit-test uses booleanPointInPolygon against every Polygon/MultiPolygon in
    // geoman's feature collection.

    map.on('click', function(e) {
      // If the event was fired synthetically by selectCommunityInGeoman, skip.
      if (!e.originalEvent || !e.originalEvent.shiftKey) {
        // Plain click — clear boolean-ops selection and update UI
        if (selected.length > 0) {
          selected = [];
          updateBoolopsUI();
        }
        return;
      }

      // Shift+click — find topmost polygon under cursor
      var lngLat = e.lngLat;
      var clickPt = point([lngLat.lng, lngLat.lat]);
      var fc = window.__gm.features.getAll();
      if (!fc || !fc.features) return;

      // Walk in reverse order so the "topmost" (last-drawn) feature wins
      var hit = null;
      for (var i = fc.features.length - 1; i >= 0; i--) {
        var f = fc.features[i];
        if (!f.geometry) continue;
        var type = f.geometry.type;
        if (type !== 'Polygon' && type !== 'MultiPolygon') continue;
        try {
          if (booleanPointInPolygon(clickPt, f)) {
            hit = f;
            break;
          }
        } catch (_err) {
          // malformed geometry — skip
        }
      }

      if (!hit) return; // shift+clicked empty map area — no change
      toggleSelected(hit.id);
      updateBoolopsUI();
    });

    // ── Boolean op execution ────────────────────────────────────────────────────

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    async function runBoolOp(opName) {
      if (selected.length < 2) return;

      var fc = window.__gm.features.getAll();
      var f0 = fc && fc.features && fc.features.find(function(f) {
        return String(f.id) === String(selected[0]);
      });
      var f1 = fc && fc.features && fc.features.find(function(f) {
        return String(f.id) === String(selected[1]);
      });

      if (!f0 || !f1) {
        setStatus('selected features no longer exist');
        selected = [];
        updateBoolopsUI();
        return;
      }

      var result = null;
      if (opName === 'union') {
        result = unionPolygons(f0.geometry, f1.geometry);
      } else if (opName === 'subtract') {
        result = differencePolygons(f0.geometry, f1.geometry);
      } else if (opName === 'intersect') {
        result = intersectPolygons(f0.geometry, f1.geometry);
      }

      if (!result) {
        setStatus(opName + ' produced no geometry — nothing to do');
        return;
      }

      var opLabel = opName === 'union' ? 'Union' :
                    opName === 'subtract' ? 'Subtract' : 'Intersect';

      if (!confirm(opLabel + ' will replace 2 shapes with 1 result. Continue?')) return;

      // Snapshot hook for T6 undo — T6 will wire the actual stack.
      if (typeof window.__snapshot === 'function') window.__snapshot();

      // Delete originals.
      // API: gm.features.get('gm_main', id) → FeatureData | null
      //      gm.features.delete(featureData)
      var fd0 = window.__gm.features.get('gm_main', f0.id);
      var fd1 = window.__gm.features.get('gm_main', f1.id);
      if (fd0) window.__gm.features.delete(fd0);
      if (fd1) window.__gm.features.delete(fd1);

      // Add result.
      // The result carries f0's properties so subsequent Save updates the correct
      // DB row. If f0 had no communitySlug (unsaved), the result is also unsaved.
      var slug       = f0.properties && f0.properties.communitySlug;
      var name       = f0.properties && f0.properties.communityName;
      var regionSlug = f0.properties && f0.properties.regionSlug;

      window.__gm.features.addGeoJsonFeature({
        type: 'Feature',
        properties: {
          communitySlug: slug       || undefined,
          communityName: name       || undefined,
          regionSlug:    regionSlug || undefined,
        },
        geometry: result,
      });

      selected = [];
      updateBoolopsUI();
      setStatus(opLabel + ' ok — replaced 2 with 1');
    }

    // Wire the three buttons
    document.getElementById('op-union').addEventListener('click', function() {
      runBoolOp('union');
    });
    document.getElementById('op-subtract').addEventListener('click', function() {
      runBoolOp('subtract');
    });
    document.getElementById('op-intersect').addEventListener('click', function() {
      runBoolOp('intersect');
    });

    // ── Weld Nearby Vertices — slider label + handler ───────────────────────────

    var weldThresholdEl      = document.getElementById('weld-threshold');
    var weldThresholdLabelEl = document.getElementById('weld-threshold-label');

    weldThresholdEl.addEventListener('input', function() {
      weldThresholdLabelEl.textContent = weldThresholdEl.value + ' m';
    });

    document.getElementById('op-weld').addEventListener('click', function() {
      if (selected.length !== 1) return;
      var all = window.__gm.features.getAll();
      var f = all.features.find(function(x) { return String(x.id) === String(selected[0]); });
      if (!f) {
        setStatus('selected feature no longer exists');
        selected = [];
        updateBoolopsUI();
        return;
      }
      if (f.geometry.type !== 'Polygon' && f.geometry.type !== 'MultiPolygon') {
        setStatus('weld only applies to polygons');
        return;
      }

      var threshold = Number(weldThresholdEl.value);
      var before = countVertices(f.geometry);
      var result = weldGeometry(f.geometry, threshold);
      var after = countVertices(result);
      if (after === before) {
        setStatus('weld at ' + threshold + ' m removed 0 vertices — no change');
        return;
      }

      window.__snapshot?.();

      var fd = window.__gm.features.get('gm_main', f.id);
      if (fd) window.__gm.features.delete(fd);
      window.__gm.features.addGeoJsonFeature({
        type: 'Feature',
        properties: Object.assign({}, f.properties || {}),
        geometry: result,
      });

      selected = [];
      updateBoolopsUI();
      setStatus('welded — removed ' + (before - after) + ' vertices (' + before + ' → ' + after + ') at ' + threshold + ' m');
    });

    // Clear selection when geoman adds or removes features (e.g. user deletes a
    // selected shape, or a new draw is started).
    // These are wired below alongside the existing gm:create / gm:remove handlers.

    // ── Event wiring ────────────────────────────────────────────────────────────

    map.on('load', function() {
      initHoverLayer();
      initSnapCandidateLayer();

      // ── Enable geoman snapping (vertex + edge + midpoint) ──────────────────
      //
      // enableMode('helper', 'snapping') instantiates SnappingHelper and stores
      // it at gm.actionInstances['helper__snapping'].  It must be called before
      // we try to set tolerance or push listing coordinates.
      //
      // Vertex/edge/midpoint snapping is geoman's default behaviour — the library
      // handles all three target types internally without per-flag options (none
      // exist in the GmOptionsData schema).
      try {
        gm.enableMode('helper', 'snapping');
        const helper = getSnappingHelper();
        if (helper) {
          helper.tolerance = SNAP_RADIUS_DEFAULT;
        }
      } catch (_err) {
        // Snap helper failed to activate — editor still functional, just no snap.
      }

      loadListings();
      // Push the initial state as the baseline undo entry after communities load,
      // so the operator can undo all the way back to the loaded state.
      loadCommunities().then(function() { snapshot(); });
    });

    // Snap-candidate ring tracks the cursor while the map is interactive.
    map.on('mousemove', onMapMouseMove);
    map.on('mouseout', function() { setSnapCandidate(null); });

    map.on('moveend', loadListings);

    // ── Space key — momentary snap-radius boost ─────────────────────────────
    //
    // keydown Space (not in input/textarea): boost tolerance to SNAP_RADIUS_BOOSTED
    // and set snapStrongMode = true so the visual ring also uses the wider radius.
    // keyup Space: restore SNAP_RADIUS_DEFAULT.
    //
    // If the geoman SnappingHelper is not available (e.g. snap was disabled or
    // helper not yet instantiated), the flags still flip — the mousemove handler
    // reads SNAP_RADIUS_DEFAULT/BOOSTED directly when helper.tolerance is absent.

    document.addEventListener('keydown', function(e) {
      const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
      const inInput = (tag === 'input' || tag === 'textarea');

      // ── Space: snap-radius boost ─────────────────────────────────────────────
      if (e.code === 'Space') {
        if (inInput) return; // let the user type spaces
        e.preventDefault(); // prevent page scroll
        if (snapStrongMode) return; // already boosted
        snapStrongMode = true;
        window.__snapStrongMode = true;
        const helper = getSnappingHelper();
        if (helper) {
          helper.tolerance = SNAP_RADIUS_BOOSTED;
        }
        return;
      }

      // ── Cmd/Ctrl+Z / Cmd/Ctrl+Shift+Z: undo / redo ──────────────────────────
      const isMeta = e.metaKey || e.ctrlKey;
      if (!isMeta) return;
      if (e.key !== 'z' && e.key !== 'Z') return;
      if (inInput) return; // don't capture undo while typing

      e.preventDefault();

      if (!e.shiftKey) {
        // Undo
        // The last entry in undoStack IS the current committed state.
        // We need at least 2 entries to have a "previous" state to return to.
        if (undoStack.length <= 1) { setStatus('nothing to undo'); return; }
        var current = undoStack.pop();   // remove current-state snapshot
        redoStack.push(current);         // save it for redo
        // Restore the new top of the stack (the previous committed state)
        void restore(undoStack[undoStack.length - 1]);
        setStatus('undid (' + (undoStack.length - 1) + ' more in history)');
      } else {
        // Redo
        if (redoStack.length === 0) { setStatus('nothing to redo'); return; }
        var next = redoStack.pop();
        undoStack.push(next);     // re-push to undo stack as the new current state
        void restore(next);
        setStatus('redid (' + redoStack.length + ' more available)');
      }
    });

    document.addEventListener('keyup', function(e) {
      if (e.code !== 'Space') return;
      snapStrongMode = false;
      window.__snapStrongMode = false;
      const helper = getSnappingHelper();
      if (helper) {
        helper.tolerance = SNAP_RADIUS_DEFAULT;
      }
    });

    // geoman fires these on the map instance via mapAdapter.fire():
    //   gm:create  — feature_created (polygon finished)
    //   gm:remove  — feature_removed (polygon deleted)
    //   gm:edit    — feature_updated (vertex dragged / geometry changed)
    map.on('gm:create', function() {
      // New feature drawn — clear selection so stale IDs don't linger.
      selected = [];
      updateBoolopsUI();
      updateCount();
      snapshot(); // push undo entry after the feature is committed
    });
    map.on('gm:remove', function() {
      // Feature removed — clear selection in case a selected feature was deleted.
      selected = [];
      updateBoolopsUI();
      updateCount();
      snapshot(); // push undo entry after the removal is committed
    });
    map.on('gm:edit', function() {
      updateCount();
      snapshot(); // push undo entry after the vertex edit is committed
    });

    // ── Save handler (unchanged from v1) ────────────────────────────────────────

    document.getElementById('save').addEventListener('click', async function() {
      const poly = currentPolygon();
      const slug = document.getElementById('slug').value.trim();
      const name = document.getElementById('name').value.trim();
      const region = document.getElementById('region').value.trim();
      const status = document.getElementById('status');
      if (!poly || !slug || !name || !region) {
        status.textContent = 'slug, name, region, and a polygon are required';
        return;
      }
      status.textContent = 'saving…';
      const res = await fetch('/api/community', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ slug: slug, name: name, regionSlug: region, geometry: poly.geometry }),
      });
      const body = await res.json();
      if (res.ok) {
        status.textContent = 'saved — ' + body.areaSqMi.toFixed(2) + ' sq mi, ' + body.vertexCount + ' verts';
        // Reload communities so the saved shape appears in the list with its slug.
        await loadCommunities();
      } else {
        status.textContent = 'error: ' + body.error;
      }
    });
  </script>
</body>
</html>
